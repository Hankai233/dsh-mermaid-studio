name: publish

# Publishing is driven by a version tag, so the tarball on npm always matches a
# commit that exists in the repo. Bump package.json, commit, then:
#   git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and test, but do not publish"
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The package declares engines.node >= 22.19.0; 24 is what the local
          # build runs on.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install
        run: npm ci

      - name: Tag matches package.json
        # A dry-run or a manual dispatch has no tag to compare; skip the check.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Build
        env:
          DSH_PROFILE_DIR: ${{ github.workspace }}/.dsh-profile
        run: npm run build

      - name: Committed lib matches the build
        # lib/ is shipped, so a stale artifact would put code on npm that is not
        # in the source tree. The build is deterministic; this turns a forgotten
        # rebuild into a failed job instead of a bad release.
        run: git diff --exit-code -- lib

      - name: Test
        run: npm test

      - name: Publish
        if: github.event_name == 'push' || !inputs.dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # When this repo becomes public, add `--provenance` above plus
      # `id-token: write` under permissions to publish a signed provenance
      # statement. Provenance needs a public source repository, so it is left off
      # while the repo is private.
